apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sample-api-ingress
  namespace: sample-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sample-api
  policyTypes: [Ingress]
  # Deny ingress by default. Each environment overlay must add reviewed sources.
  ingress: []
